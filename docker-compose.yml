      context: .
      args:
        REACT_APP_CONTRACT_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
        REACT_APP_TOKEN_MANAGER_ADDRESS: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
        REACT_APP_VOTING_PAYMASTER_ADDRESS: "0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9"
        REACT_APP_CHAIN_ID: "31337"
        REACT_APP_HARDHAT_RPC: "http://host.docker.internal:8545"
